<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MCP Chat</title>
</head>
<body style="margin-inline: auto; width: 65%;">

<h1>MCP Chat</h1>

<div id="chat"></div>

<form id="chat-form">
  <label for="prompt">Message</label><br>
  <input id="prompt" autocomplete="off">
  <button type="submit">Send</button>
</form>

<script>
  // Conversation history (user/assistant turns) kept client-side.
  const history = [];

  function addMessage(role, text) {
    const chat = document.getElementById('chat');
    const p = document.createElement('p');
    const name = document.createElement('strong');
    name.textContent = role + ': ';
    p.append(name, document.createTextNode(text));
    chat.appendChild(p);
    return p;
  }

  function addError(text) {
    const p = addMessage('ERROR', text);
    return p;
  }

  // Render a UI artifact inline in the conversation: a ui:// resource (MCP Apps
  // extension) loaded in a sandboxed iframe, with the tool result delivered to
  // it as a notifications/call_tool_result JSON-RPC notification.
  function renderArtifact(artifact) {
    const chat = document.getElementById('chat');
    const heading = document.createElement('h3');
    heading.textContent = 'UI resource: ' + artifact.resourceUri;
    chat.appendChild(heading);

    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
    frame.setAttribute('title', 'MCP App');
    frame.width = '100%';
    frame.height = '400';
    frame.addEventListener('load', () => {
      frame.contentWindow.postMessage({
        jsonrpc: '2.0',
        method: 'notifications/call_tool_result',
        params: artifact.result,
      }, '*');
    });
    // Attach the frame first, set src last, so the load listener is
    // guaranteed to be in place before navigation starts.
    chat.appendChild(frame);
    frame.src = '/ui-resource?uri=' + encodeURIComponent(artifact.resourceUri);
  }

  document.getElementById('chat-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('prompt');
    const text = input.value.trim();
    if (!text) return;

    addMessage('You', text);
    history.push({ role: 'user', content: text });
    input.value = '';

    const thinking = addMessage('Assistant', '... processing ...');
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await response.json();
      thinking.remove();
      if (!response.ok) {
        addError(data.error);
        return;
      }
      const reply = data.reply || '(no reply)';
      addMessage('Assistant', reply);
      history.push({ role: 'assistant', content: reply });
      for (const artifact of data.artifacts || []) {
        renderArtifact(artifact);
      }
    } catch (e) {
      thinking.remove();
      addError('Request failed: ' + e.message);
    }
  });
</script>

</body>
</html>
